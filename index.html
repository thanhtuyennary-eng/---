<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>生日快乐 Vân Vân 🎂</title>

<link href="https://fonts.googleapis.com/css2?family=ZCOOL+XiaoWei&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    font-family: 'Poppins', sans-serif;
}

/* NỀN ĐỎ */
body {
    background: radial-gradient(circle at top, #ff4d4d, #7a0000 70%);
    color: #fff;
}

/* CARD */
.card {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(255,255,255,0.18);
    padding: 55px 70px;
    border-radius: 30px;
    backdrop-filter: blur(14px);
    text-align: center;
    box-shadow: 0 0 60px rgba(255,180,180,0.6);
    z-index: 10;
    animation: pop 1.2s ease;
}

@keyframes pop {
    from { transform: translate(-50%, -50%) scale(0.6); opacity: 0; }
    to { transform: translate(-50%, -50%) scale(1); opacity: 1; }
}

h1 {
    font-family: 'ZCOOL XiaoWei', serif;
    font-size: 56px;
    margin: 0;
    color: #ffe066;
}

h2 {
    font-size: 36px;
    margin: 18px 0;
    color: #fff1c1;
}

p {
    font-size: 22px;
    line-height: 1.7;
    opacity: 0.96;
}

/* HOA */
.flower {
    position: absolute;
    font-size: 42px;
    animation: float 6s ease-in-out infinite;
}

@keyframes float {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-28px); }
}

/* BÓNG BAY */
.balloon {
    position: absolute;
    width: 45px;
    height: 60px;
    background: #ff6b6b;
    border-radius: 50% 50% 45% 45%;
    animation: rise 10s linear infinite;
}

.balloon::after {
    content: "";
    position: absolute;
    width: 2px;
    height: 40px;
    background: #fff;
    left: 50%;
    top: 60px;
}

@keyframes rise {
    from { transform: translateY(100vh); }
    to { transform: translateY(-120px); }
}

/* CANVAS */
canvas {
    position: fixed;
    top: 0;
    left: 0;
    pointer-events: none;
}
</style>
</head>

<body>

<canvas id="fireworks"></canvas>

<!-- HOA -->
<div class="flower" style="top:10%; left:8%;">🌸</div>
<div class="flower" style="top:18%; right:10%;">🌺</div>
<div class="flower" style="bottom:14%; left:12%;">🌼</div>

<!-- BÓNG BAY -->
<div class="balloon" style="left:15%; animation-delay:0s;"></div>
<div class="balloon" style="left:30%; animation-delay:2s;"></div>
<div class="balloon" style="left:70%; animation-delay:1s;"></div>
<div class="balloon" style="left:85%; animation-delay:3s;"></div>

<div class="card">
    <h1>生日快乐 🎉</h1>
    <h2>阿云 ❤️</h2>
    <p>
        愿你每天都开心快乐 🌸<br>
        身体健康，心想事成 ✨<br>
        被温柔以待，被幸福包围 🥰
    </p>
    <p style="font-size:38px;">🐻🎂🎈</p>
</div>

<script>
const canvas = document.getElementById("fireworks");
const ctx = canvas.getContext("2d");

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

class Particle {
    constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.size = Math.random() * 3 + 1;
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 6 + 3;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        this.life = 90;
        this.color = color;
    }

    update() {
        this.x += this.vx;
        this.y += this.vy;
        this.vy += 0.05;
        this.life--;
    }

    draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.fill();
    }
}

let particles = [];

function explode(x, y) {
    const colors = ["#ffd166", "#ff9f1c", "#ff6b6b", "#fff3b0"];
    for (let i = 0; i < 180; i++) {
        particles.push(new Particle(x, y, colors[Math.floor(Math.random()*colors.length)]));
    }
}

function animate() {
    ctx.fillStyle = "rgba(0,0,0,0.2)";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    particles = particles.filter(p => p.life > 0);
    particles.forEach(p => {
        p.update();
        p.draw();
    });

    requestAnimationFrame(animate);
}

setInterval(() => {
    explode(
        Math.random() * canvas.width,
        Math.random() * canvas.height * 0.6
    );
}, 900);

animate();
</script>

</body>
</html>
